      - name: Install sing-box
        run: |
          # Получаем прямую ссылку на скачивание архива для linux-amd64 из релизов API
          DOWNLOAD_URL=$(curl -fsSL -H "Authorization: Bearer ${{ github.token }}" \
            https://github.com \
            | grep -o '"browser_download_url": "[^"]*' \
            | grep 'linux-amd64' \
            | head -n 1 \
            | cut -d'"' -f4)
          
          if [ -z "$DOWNLOAD_URL" ]; then
            echo "Ошибка: не удалось найти ссылку для linux-amd64"
            exit 1
          fi
          
          curl -fsSL -o sb.tar.gz "$DOWNLOAD_URL"
          tar -xzf sb.tar.gz --strip-components=1
          sudo install -m 755 sing-box /usr/local/bin/sing-box
          sing-box version

      - name: Restore dead keys cache
        uses: actions/cache@v4
        with:
          path: cache/dead_keys.json
          key: dead-keys-${{ github.run_id }}
          restore-keys: |
            dead-keys-

      - name: Check keys and delete dead messages
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          TG_TOPIC_ID: ${{ secrets.TG_TOPIC_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          WORKERS: "20"
          TIMEOUT: "8"
          DEAD_TTL_DAYS: "7"
        run: python scripts/tg_forum_clean.py
