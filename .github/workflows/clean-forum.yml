name: Clean forum keys

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Только показать, что удалится"
        type: boolean
        default: true
      log_level:
        description: "Уровень логов"
        type: choice
        options:
          - DEBUG
          - INFO
          - WARNING
        default: INFO

permissions:
  contents: read

concurrency:
  group: clean-forum
  cancel-in-progress: false

jobs:
  clean:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install telethon "requests[socks]" psycopg2-binary

      - name: Install Xray
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
               --retry 3 --retry-delay 2 --retry-all-errors \
               -o /tmp/xray.zip \
               "https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip"
          sudo unzip -o /tmp/xray.zip xray -d /usr/local/bin
          sudo chmod +x /usr/local/bin/xray
          rm -f /tmp/xray.zip
          xray version

      - name: Install sing-box
        run: |
          set -euo pipefail
          # Ответ API качаем в файл, а не в пайплайн (иначе curl падает с ошибкой 23)
          curl --fail --silent --show-error --location \
               --retry 3 --retry-delay 2 --retry-all-errors \
               -H "Authorization: Bearer ${{ github.token }}" \
               -H "Accept: application/vnd.github+json" \
               -o /tmp/sb_latest.json \
               "https://api.github.com/repos/SagerNet/sing-box/releases/latest"

          TAG=$(jq -r '.tag_name' /tmp/sb_latest.json)
          VER="${TAG#v}"

          if [[ -z "$VER" || "$VER" == "null" ]]; then
            echo "Не удалось определить версию sing-box. Ответ API:" >&2
            cat /tmp/sb_latest.json >&2
            exit 1
          fi
          echo "sing-box version: ${VER}"

          curl --fail --silent --show-error --location \
               --retry 3 --retry-delay 2 --retry-all-errors \
               -o /tmp/sb.tar.gz \
               "https://github.com/SagerNet/sing-box/releases/download/v${VER}/sing-box-${VER}-linux-amd64.tar.gz"
          tar -xzf /tmp/sb.tar.gz -C /tmp
          sudo install -m 755 "/tmp/sing-box-${VER}-linux-amd64/sing-box" /usr/local/bin/sing-box
          rm -rf /tmp/sb.tar.gz "/tmp/sing-box-${VER}-linux-amd64" /tmp/sb_latest.json
          sing-box version

      - name: Check keys and delete dead messages
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          TG_TOPIC_ID: ${{ secrets.TG_TOPIC_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          LOG_LEVEL: ${{ github.event.inputs.log_level || 'INFO' }}
          WORKERS: "20"
          TIMEOUT: "8"
          OK_INTERVAL_SEC: "3600"
          BACKOFF_BASE_SEC: "3600"
          BACKOFF_FACTOR: "2"
          BACKOFF_MAX_SEC: "604800"
          DELETE_AFTER_FAILS: "1"
          STATE_TTL_DAYS: "0"
          SAFEGUARD_MIN: "10"
        run: python scripts/tg_forum_clean.py
