name: Clean forum keys

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Только показать, что удалится"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: clean-forum
  cancel-in-progress: false

jobs:
  clean:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install telethon "requests[socks]"

      - name: Install Xray
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
               --retry 3 --retry-delay 2 --retry-all-errors \
               -o /tmp/xray.zip \
               "https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip"
          sudo unzip -o /tmp/xray.zip xray -d /usr/local/bin
          sudo chmod +x /usr/local/bin/xray
          rm -f /tmp/xray.zip
          xray version

      - name: Install sing-box
        run: |
          set -euo pipefail
          # ВАЖНО: качаем ответ API в файл, а НЕ в пайплайн.
          # Раньше было `curl | grep -m1`: grep закрывал пайп раньше,
          # чем curl докачивал ответ -> обрыв записи -> ошибка 23.
          curl --fail --silent --show-error --location \
               --retry 3 --retry-delay 2 --retry-all-errors \
               -H "Authorization: Bearer ${{ github.token }}" \
               -H "Accept: application/vnd.github+json" \
               -o /tmp/sb_latest.json \
               "https://api.github.com/repos/SagerNet/sing-box/releases/latest"

          TAG=$(jq -r '.tag_name' /tmp/sb_latest.json)
          VER="${TAG#v}"

          if [[ -z "$VER" || "$VER" == "null" ]]; then
            echo "Не удалось определить версию sing-box. Ответ API:" >&2
            cat /tmp/sb_latest.json >&2
            exit 1
          fi
          echo "sing-box version: ${VER}"

          curl --fail --silent --show-error --location \
               --retry 3 --retry-delay 2 --retry-all-errors \
               -o /tmp/sb.tar.gz \
               "https://github.com/SagerNet/sing-box/releases/download/v${VER}/sing-box-${VER}-linux-amd64.tar.gz"
          tar -xzf /tmp/sb.tar.gz -C /tmp
          sudo install -m 755 "/tmp/sing-box-${VER}-linux-amd64/sing-box" /usr/local/bin/sing-box
          rm -rf /tmp/sb.tar.gz "/tmp/sing-box-${VER}-linux-amd64" /tmp/sb_latest.json
          sing-box version

      - name: Restore dead keys cache
        uses: actions/cache@v6
        with:
          path: cache/dead_keys.json
          key: dead-keys-${{ github.run_id }}
          restore-keys: |
            dead-keys-

      - name: Check keys and delete dead messages
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          TG_TOPIC_ID: ${{ secrets.TG_TOPIC_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          WORKERS: "20"
          TIMEOUT: "8"
          DEAD_TTL_DAYS: "7"
        run: python scripts/tg_forum_clean.py
